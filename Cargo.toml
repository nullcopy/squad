[package]
name = "squad"
version = "0.1.0"
license = "GPL-3.0-or-later"
edition = "2021"
authors = ["cargodog"]
description = "Assemble your squad of AI agents"
repository = "https://github.com/cargodog/squad"
readme = "README.md"
keywords = ["ai", "agents", "containers", "docker", "podman"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
colored = "2.1"
tabled = "0.15"
which = "6.0"
futures = "0.3"

[dev-dependencies]
tempfile = "3.8"
assert_cmd = "2.0"
predicates = "3.0"
mockall = "0.12"

[profile.release]
lto = true
opt-level = 3
strip = true

[[bin]]
name = "squad"
path = "src/main.rs"
